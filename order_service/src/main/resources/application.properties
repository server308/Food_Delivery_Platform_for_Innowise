spring.application.name=order_service
spring.datasource.url=jdbc:postgresql://localhost:5432/food_delivery_platform_orders
spring.datasource.username=postgres
spring.datasource.password=12345

spring.flyway.url=jdbc:postgresql://localhost:5432/food_delivery_platform_orders
spring.flyway.user=postgres
spring.flyway.password=12345
spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true